name: CI

on:
  push:
    branches: [ master ]

  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          echo "Required Xcode: $XCODE_VERSION"
          ls /Applications/ | grep -i xcode || true
          if [ -d "/Applications/Xcode_$XCODE_VERSION.app" ]; then
            sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer
          else
            echo "Xcode $XCODE_VERSION not found, falling back to default toolchain:"
            xcodebuild -version || true
          fi

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          # collect ipa (resolve via find: exact bazel-out config dir varies by toolchain)
          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          IPA_SRC="$(find -L bazel-out -maxdepth 5 -path '*/bin/Telegram/Telegram.ipa' | head -1)"
          if [ -z "$IPA_SRC" ]; then
            echo "Telegram.ipa not found under bazel-out"
            find -L bazel-out -maxdepth 5 -name '*.ipa' | head
            exit 1
          fi
          echo "Found IPA at $IPA_SRC"
          cp "$IPA_SRC" "$OUTPUT_PATH/"

          # collect dsym
          mkdir -p build/DSYMs
          find -L bazel-out -maxdepth 5 -path '*/bin/Telegram/*.dSYM' -exec cp -R {} build/DSYMs/ \;
          zip -r "./$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs 1>/dev/null

      - name: Create Release and upload assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ env.BUILD_NUMBER }}" \
            --title "Telegram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})" \
            --notes "An unsigned build of Telegram for iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})" \
            "/Users/Shared/telegram-ios/build/artifacts/Telegram.ipa#Telegram.ipa" \
            "/Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip#Telegram.DSYMs.zip"

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-ipa
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload dSYMs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-dSYMs
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
          if-no-files-found: error
          retention-days: 14
